# The example, published as a reader anybody can open.
#
# Interproof is hard to describe and immediate to look at, so the repository
# publishes its own example: two short papers, a small Lean formalization, and
# the correspondence between them, live at the Pages URL.  A visitor decides
# whether this tool is for them in about ten seconds, without installing
# anything — which is more than any README paragraph can do.
#
# Requires Pages to be enabled once, with Settings -> Pages -> Source set to
# "GitHub Actions".

name: pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run is superseded rather than cancelled,
# so the site always ends up matching the newest commit that finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the default branch is published, whatever it happens to be called.
    # Naming `main` here is a guess about somebody else's repository, and it
    # fails silently: the workflow simply never runs, and the absence of a
    # deployment looks exactly like a deployment that has not happened yet.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: install
        run: pip install -e .

      # A dangling citation must not reach the published page: the one claim
      # this reader makes about itself is that the two sides agree.
      - name: check
        working-directory: examples/demo
        run: interproof check

      - name: build
        working-directory: examples/demo
        run: interproof build -o ../../_site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
