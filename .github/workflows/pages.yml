# The example, published as a reader anybody can open.
#
# Interproof is hard to describe and immediate to look at, so the repository
# publishes its own example: two short papers, a small Lean formalization, and
# the correspondence between them, live at the Pages URL.  A visitor decides
# whether this tool is for them in about ten seconds, without installing
# anything — which is more than any README paragraph can do.
#
# Requires Pages to be enabled once, with Settings -> Pages -> Source set to
# "GitHub Actions".  Enabling it also creates a `github-pages` environment
# whose deployment branch policy names whatever the default branch was at that
# moment; rename or replace the default branch afterwards and deployments are
# refused until that policy is updated too.
#
# A branch named here is a branch that has to keep existing.  When it does not,
# this workflow does not fail -- it simply never runs, which looks exactly like
# a deployment that has not happened yet.  If publishing ever goes quiet, look
# here first.

name: pages

# Only `main`.  Development happens on other branches and must not spend a
# TeX installation, a LaTeX run and a deployment every time one of them moves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run is superseded rather than cancelled,
# so the site always ends up matching the newest commit that finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: install
        run: pip install -e .

      # A dangling citation must not reach the published page: the one claim
      # this reader makes about itself is that the two sides agree.  This runs
      # before Lean is anywhere near the job, because `check` asks whether the
      # citations resolve and no answer it gives changes with the types.
      - name: check
        working-directory: examples/demo
        run: interproof check

      # --- the elaborated half -------------------------------------------
      #
      # Pages serves bytes; it has no opinion about Lean.  Elaboration happens
      # *here*, on the runner, and what it learned is baked into the page — so
      # the published site is the same self-contained folder it always was and
      # needs no more of GitHub than any other static site.
      #
      # The example depends on nothing but Lean core, which is what makes this
      # affordable: no Mathlib to fetch, no `lake exe cache get`.
      - name: install Lean
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Three caches in one, and the third is the interesting one.  `~/.elan`
      # is the toolchain and `.lake` is the compiled dependency; Interproof's
      # own extraction cache is keyed by each module's text and its imports'
      # text, so a commit touching one module re-elaborates that module and
      # what imports it, and restores the rest.  The restore-key is what makes
      # that possible: an exact miss on the sources still recovers everything
      # that does not depend on them.
      - name: cache Lean and what has already been elaborated
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            examples/demo/lean/.lake
            examples/demo/.interproof/build/subverso
          key: lean-${{ hashFiles('examples/demo/lean/lean-toolchain', 'examples/demo/lean/lake-manifest.json') }}-${{ hashFiles('examples/demo/lean/**/*.lean') }}
          restore-keys: |
            lean-${{ hashFiles('examples/demo/lean/lean-toolchain', 'examples/demo/lean/lake-manifest.json') }}-

      - name: build
        working-directory: examples/demo
        run: interproof build --elaborate -o ../../_site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
